# Builds the site with Eleventy and publishes it on GitHub Pages at
# https://malinneamtzu.com on every push to main (replaces Netlify).
# Progress: the repo's "Actions" tab on GitHub.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # also allows a manual run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, the newer push wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Resized images from the previous run, so only new or changed
      # images are processed (the slowest part of the build).
      - uses: actions/cache@v4
        with:
          path: _site/img
          key: img-${{ github.run_id }}
          restore-keys: img-

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
