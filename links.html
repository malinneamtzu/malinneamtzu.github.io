<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Links / Mălin Neamțu</title>

  <style>
    @font-face {
      font-family: "variable-font-01";
      src: url("./20250528-Segmentor-03.ttf") format("truetype");
      font-weight: 100 900;
      font-style: normal;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: "variable-font-01";
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: left;
      background-color: black;
      color: lightgrey;
      overflow: hidden;
      position: relative;
    }

    /* Video background */
    .video-bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    /* Foreground content */
    .content {
      position: relative;
      z-index: 1;
      font-size: 1.5rem; /* desktop size */
      font-variation-settings:
        "AAAA" var(--aaaa),
        "BBBB" var(--bbbb),
        "CCCC" var(--cccc),
        "DDDD" var(--dddd);
      line-height: 1.6;
    }

    @media (max-width: 768px) {
      .content {
        font-size: 1rem;
        line-height: 1.55;
      }
    }


    .back-link {
      margin-top: 3rem;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0 0 1.5rem 0;
    }

    ul li {
      margin-bottom: 1rem;
    }

    a {
      color: lightgrey;
      text-decoration: none;
      border-bottom: 2px solid transparent;
      padding-bottom: 2px;
      transition: border-color 0.1s;
    }

    a:hover {
      border-color: lightgrey;
    }

    /* Mobile motion permission overlay */
    #enable-motion {
      position: fixed;
      inset: 0;
      z-index: 2;
      background: black;
      color: lightgrey;
      display: none;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
      text-align: center;
    }
  </style>
</head>

<body>

  <!-- Background video -->
  <video
    class="video-bg"
    id="bg-video"
    autoplay
    muted
    loop
    playsinline
  ></video>

  <!-- Mobile permission button -->
  <div id="enable-motion">
    Tap to enable motion
  </div>

  <!-- Foreground content -->
  <div class="content">
    <h1>Links</h1>

    <ul>
      <li><a href="https://www.youtube.com/watch?v=4W-PnDmmwX8" target="_blank">Segmentor Demo</a></li>
      <li><a href="https://tdc.org/weekly-type/segmentor/" target="_blank">TDC Weekly Type</a></li>
      <li><a href="https://fontsinuse.com/type_designers/10144/malin-neam-u" target="_blank">Fonts in Use</a></li>
      <li><a href="https://tl-gfx.com" target="_blank">TL—GFX</a></li>
      <li><a href="https://www.discogs.com/artist/14797964-Mălin-Neamțu" target="_blank">Discogs</a></li>
    </ul>

    <h2>Contact</h2>

    <ul>
      <li><a href="https://www.instagram.com/malin.neamtzu/" target="_blank">Instagram</a></li>
      <li><a href="https://www.linkedin.com/in/malin-neamtzu-a223861ab/" target="_blank">LinkedIn</a></li>
      <li><a href="https://www.behance.net/neamtzumal7e69/" target="_blank">Behance</a></li>
      <li><a href="https://typo.social/@malinneamtzu" target="_blank">typo.social</a></li>
    </ul>

    <p class="back-link">
      <a href="index.html">back to main</a>
    </p>
  </div>

<script>
  const AAAA_MAX = 1000;
  const BBBB_MAX = 1000;
  const CCCC_MAX = 1000;
  const DDDD_MAX = 1000;

  const isMobile = window.matchMedia("(pointer: coarse)").matches;

  document.documentElement.style.setProperty('--aaaa', 0);
  document.documentElement.style.setProperty('--bbbb', 0);
  document.documentElement.style.setProperty('--cccc', 0);
  document.documentElement.style.setProperty('--dddd', 0);

  const video = document.getElementById("bg-video");

  /* Video source */
  if (isMobile) {
    video.src = "V03-BG-Video-Site-Mobile-MalinNeamtzu-ios.mp4";
  } else {
    video.src = "V03-BG-Video-Site-MalinNeamtzu.mp4";
  }

  video.preload = "auto";
  video.muted = true;
  video.load();

  function updateFont(x, y) {
    const distX = Math.abs(x - 0.5) * 2;
    const distY = Math.abs(y - 0.5) * 2;

    let aaaa = 0;
    let bbbb = 0;
    let cccc = 0;
    let dddd = 0;

    if (y < 0.5) aaaa = distY * AAAA_MAX;
    else bbbb = distY * BBBB_MAX;

    if (x < 0.5) cccc = distX * CCCC_MAX;
    else dddd = distX * DDDD_MAX;

    document.documentElement.style.setProperty('--aaaa', aaaa.toFixed(2));
    document.documentElement.style.setProperty('--bbbb', bbbb.toFixed(2));
    document.documentElement.style.setProperty('--cccc', cccc.toFixed(2));
    document.documentElement.style.setProperty('--dddd', dddd.toFixed(2));
  }

  function handleOrientation(e) {
    const x = Math.min(Math.max((e.gamma || 0) / 60 + 0.5, 0), 1);
    const y = Math.min(Math.max((e.beta || 0) / 60 + 0.5, 0), 1);
    updateFont(x, y);
  }

  /* Desktop: mouse */
  if (!isMobile) {
    window.addEventListener("mousemove", (e) => {
      updateFont(
        e.clientX / window.innerWidth,
        e.clientY / window.innerHeight
      );
    });
  }

  /* Mobile: gyroscope */
  if (isMobile) {
    const button = document.getElementById("enable-motion");
    const motionEnabled = sessionStorage.getItem("motionEnabled") === "true";
  
    if (motionEnabled) {
      // User already tapped on previous page
      video.play().catch(() => {});
      window.addEventListener("deviceorientation", handleOrientation);
      button.style.display = "none";
    } else {
      // First time user
      button.style.display = "flex";
  
      button.addEventListener("click", async () => {
        video.play().catch(() => {});
  
        if (
          typeof DeviceOrientationEvent !== "undefined" &&
          typeof DeviceOrientationEvent.requestPermission === "function"
        ) {
          const permission = await DeviceOrientationEvent.requestPermission();
          if (permission !== "granted") return;
        }
  
        sessionStorage.setItem("motionEnabled", "true");
        window.addEventListener("deviceorientation", handleOrientation);
        button.style.display = "none";
      });
    }
  }
  
</script>

</body>
</html>
